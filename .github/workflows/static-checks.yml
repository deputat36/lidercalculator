name: Static checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  crm-v4:
    name: CRM v4 static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CRM loader chain
        run: |
          set -euo pipefail
          grep -F 'assets/v4/auth.js?v=20260624-contour-1' app-v4.html
          grep -F 'assets/v4/auth-session-reset-v1.js?v=20260624-contour-1' app-v4.html
          grep -F 'assets/v4/site-cache-note-v1.js?v=20260716-2' app-v4.html
          grep -F 'assets/v4/calculations-revision-v1.css?v=20260716-2' app-v4.html
          grep -F 'assets/v4/calculations-revision-v1.js?v=20260716-2' app-v4.html
          grep -F "crm-ui-selfcheck-v1.js?v=20260624-contour-1" assets/v4/site-cache-note-v1.js
          grep -F "public-lead-audit-v1.js?v=20260623-1" assets/v4/site-cache-note-v1.js
          if grep -Fq 'calculations-revision-v1.js' assets/v4/site-cache-note-v1.js; then
            echo 'Calculation editor must be loaded directly by app-v4.html, not through the cache note.' >&2
            exit 1
          fi

      - name: Check calculation revision workflow
        run: |
          set -euo pipefail
          node --check assets/v4/calculations-revision-v1.js
          node --check assets/v4/calculations-saved-tools-v2.js
          grep -F 'revision_root_id' assets/v4/calculations-saved-tools-v2.js
          grep -F 'is_current_revision' assets/v4/calculations-saved-tools-v2.js
          grep -F 'data-revision-new' assets/v4/calculations-saved-tools-v2.js
          grep -F 'data-revision-edit' assets/v4/calculations-saved-tools-v2.js
          migration='supabase/migrations/20260716150000_leader_calculation_revision_lineage.sql'
          grep -F 'leader_lead_calculations_root_version_uidx' "$migration"
          grep -F 'leader_lead_calculations_one_current_uidx' "$migration"
          grep -F 'for update;' "$migration"
          grep -F 'security invoker' "$migration"
          grep -F 'revoke all on function public.leader_create_calculation_revision' "$migration"

      - name: Check test CRM session isolation
        run: |
          set -euo pipefail
          reset='assets/v4/auth-session-reset-v1.js'
          client='assets/v4/supabase-client.js'
          config='assets/v4/config.js'
          selfcheck='assets/v4/crm-ui-selfcheck-v1.js'
          grep -F "authStorageKey: 'leader_crm_v4_test_session'" "$config"
          grep -F "const CRM_SESSION_KEY = 'leader_crm_v4_test_session'" "$reset"
          grep -F "const LEGACY_SHARED_SESSION_KEY = 'leader_crm_v4_session'" "$reset"
          grep -F "const EXPECTED_STORAGE_KEY = 'leader_crm_v4_test_session'" "$selfcheck"
          grep -F "const LEGACY_STORAGE_KEY = 'leader_crm_v4_session'" "$selfcheck"
          grep -F "row('Контур', 'Временный тестовый'" "$selfcheck"
          grep -F "row('Сессия контура'" "$selfcheck"
          grep -F "row('Старый общий ключ'" "$selfcheck"
          grep -F 'let refreshPromise = null' "$client"
          grep -F 'if (!refreshPromise)' "$client"
          grep -F 'async getUser()' "$client"
          grep -F '/auth/v1/user' "$client"
          if grep -Fq "authStorageKey: 'leader_crm_v4_session'" "$config"; then
            echo 'Test CRM must not use the legacy shared auth key.' >&2
            exit 1
          fi
          if grep -Eq "startsWith\('sb-'\)|includes\('supabase'\)|Object\.keys\(localStorage\)" "$reset"; then
            echo 'CRM session reset must not remove storage keys belonging to other applications.' >&2
            exit 1
          fi

      - name: Check tester and audit diagnostics
        run: |
          set -euo pipefail
          grep -F 'Проверка загруженных разделов и доступа CRM' assets/v4/crm-ui-selfcheck-v1.js
          grep -F 'public_lead_audit' assets/v4/crm-ui-selfcheck-v1.js
          grep -F 'CRM_TEST_ISSUE_URL' assets/v4/crm-ui-selfcheck-v1.js
          grep -F 'payloadText' assets/v4/public-lead-audit-v1.js
          grep -F 'Referer:' assets/v4/public-lead-audit-v1.js
          grep -F 'Технические данные' assets/v4/public-lead-audit-v1.js
