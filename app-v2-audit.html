<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>РА Лидер — аудит CRM</title>
<script src="assets/supabase-bridge.js?v=20260524-audit-2"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--good:#166534;--warn:#92400e;--bad:#991b1b;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1180px;margin:0 auto;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(15,23,42,.04)}h1{margin:0;font-size:25px}h2{margin:0 0 10px;font-size:18px}p{margin:6px 0;color:var(--muted);line-height:1.5}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer;text-decoration:none;color:#111827}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.danger{background:#991b1b;color:#fff;border-color:#991b1b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.test{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.test-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-weight:900}.meta{color:var(--muted);font-size:13px;line-height:1.45;margin-top:6px;overflow-wrap:anywhere}.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-weight:900;font-size:12px}.good{background:#dcfce7;color:var(--good)}.warn{background:#fef3c7;color:var(--warn)}.bad{background:#fee2e2;color:var(--bad)}.log{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:14px;padding:12px;max-height:360px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.auth{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.summary>div{border:1px solid var(--line);border-radius:14px;background:#f9fafb;padding:12px}.summary span{display:block;font-size:12px;color:var(--muted);font-weight:900}.summary b{font-size:20px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.top{display:block}.auth{grid-template-columns:1fr}}@media(max-width:560px){.grid,.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Аудит CRM РА «Лидер»</h1><p>Проверяет авторизацию, Supabase, таблицы, версии скриптов, наличие модулей и проблемы кеша.</p></div>
    <div class="buttons"><a class="btn" href="app-v2.html">Открыть CRM</a><a class="btn" href="app-v2-novpn.html">CRM без CDN</a><button id="resetBtn" class="danger">Сбросить вход</button></div>
  </div>
  <div class="card"><h2>Быстрые действия</h2><div class="buttons"><button id="runBtn" class="primary">Полный аудит</button><button id="authBtn">Проверить вход</button><button id="dataBtn">Проверить таблицы</button><button id="assetsBtn">Проверить файлы и версии</button></div><div class="auth"><input id="email" type="email" placeholder="email для входа"><input id="password" type="password" placeholder="пароль"><button id="loginBtn" class="primary">Войти</button></div></div>
  <div class="card"><h2>Сводка</h2><div class="summary"><div><span>Ошибки</span><b id="sumBad">0</b></div><div><span>Предупреждения</span><b id="sumWarn">0</b></div><div><span>Успешно</span><b id="sumGood">0</b></div><div><span>Версия загрузчика</span><b id="sumVersion">—</b></div></div></div>
  <div class="grid" id="tests"></div>
  <div class="card"><h2>Журнал</h2><div id="log" class="log">Готов к аудиту.</div></div>
</div>
<script>
(function(){
var tests={}, errors=[];
var currentVersion='20260524-24';
var moduleFiles=[
 ['supabase','assets/supabase-bridge.js'],
 ['app','assets/app-v2.js'],
 ['loader','assets/app-v2-orders.js'],
 ['progress','assets/app-v2-order-progress.js'],
 ['finance','assets/app-v2-order-finance.js'],
 ['timeline','assets/app-v2-order-timeline.js'],
 ['guard','assets/app-v2-process-guard.js'],
 ['dashboard','assets/app-v2-manager-dashboard.js'],
 ['banner','assets/app-v2-banner-wizard.js'],
 ['postFlow','assets/app-v2-post-order-flow.js'],
 ['design','assets/app-v2-design-tasks.js'],
 ['production','assets/app-v2-production.js'],
 ['installation','assets/app-v2-installation.js'],
 ['calcGuard','assets/app-v2-calc-guard.js']
];
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function log(s){el('log').textContent+='\n['+new Date().toLocaleTimeString('ru-RU')+'] '+s;el('log').scrollTop=el('log').scrollHeight}
function cls(ok){return ok===true?'good':ok===false?'bad':'warn'}
function label(ok){return ok===true?'OK':ok===false?'ОШИБКА':'ВНИМАНИЕ'}
function set(k,t,ok,m){tests[k]={t:t,ok:ok,m:m||''};render()}
function render(){var keys=Object.keys(tests);el('tests').innerHTML=keys.map(function(k){var r=tests[k];return '<div class="test"><div class="test-head"><div class="title">'+esc(r.t)+'</div><span class="status '+cls(r.ok)+'">'+label(r.ok)+'</span></div><div class="meta">'+esc(r.m)+'</div></div>'}).join('');var bad=0,warn=0,good=0;keys.forEach(function(k){if(tests[k].ok===false)bad++;else if(tests[k].ok===true)good++;else warn++});el('sumBad').textContent=bad;el('sumWarn').textContent=warn;el('sumGood').textContent=good}
function timeout(p,ms,msg){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error(msg||'timeout'))},ms)})])}
async function txt(url){var r=await timeout(fetch(url+'?audit='+Date.now(),{cache:'no-store'}),12000,'Файл '+url+' не ответил');if(!r.ok)throw new Error(url+' HTTP '+r.status);return await r.text()}
async function head(url){var r=await timeout(fetch(url+'?audit='+Date.now(),{method:'GET',cache:'no-store'}),12000,'Файл '+url+' не ответил');return r.ok}
window.onerror=function(m){errors.push(String(m));set('browser','Ошибки браузера',false,errors.join('\n'))};
window.onunhandledrejection=function(e){errors.push(String(e.reason&&e.reason.message||e.reason||e));set('browser','Ошибки браузера',false,errors.join('\n'))};
async function session(){
 set('client','Supabase client',!!window.db,'source: '+(window.LEADER_SUPABASE_CLIENT_SOURCE||'не указан')+'; db: '+(window.db?'есть':'нет'));
 if(!window.db)throw new Error('window.db не создан');
 var r=await timeout(window.db.auth.getSession(),12000,'getSession не ответил');
 var s=r.data&&r.data.session;
 set('session','Сессия',!!s,s&&s.user?'email: '+s.user.email:'Сессии нет. Нужно войти.');
 if(!s)throw new Error('Нет сессии');
 var p=await timeout(window.db.from('leader_user_profiles').select('email,role,is_active,full_name').eq('user_id',s.user.id).maybeSingle(),12000,'Профиль не ответил');
 if(p.error)throw new Error(p.error.message);
 set('profile','Профиль CRM',!!(p.data&&p.data.is_active),p.data?'роль: '+p.data.role+'; активен: '+p.data.is_active:'профиль не найден');
 return s;
}
async function table(k,title,name){var t0=performance.now();var r=await timeout(window.db.from(name).select('*',{count:'exact',head:true}),15000,title+' не ответила');var ms=Math.round(performance.now()-t0);if(r.error){set(k,title,false,r.error.message);return false}set(k,title,true,'count: '+(r.count==null?'—':r.count)+'; '+ms+' мс');return true}
async function data(){await session();await table('t_leads','Таблица заявок','leader_leads');await table('t_orders','Таблица заказов','leader_orders');await table('t_items','Позиции заказов','leader_order_items');await table('t_payments','Платежи','leader_payments');await table('t_catalog','Номенклатура','leader_catalog');await table('t_design','Дизайн-задачи','leader_design_tasks');await table('t_prod','Производство','leader_production_jobs');await table('t_inst','Монтаж','leader_installation_jobs')}
async function assets(){
 var html=await txt('app-v2-novpn.html');
 var m=html.match(/app-v2-orders\.js\?v=([0-9\-]+)/);
 var stable=m?m[1]:'не найдено';
 el('sumVersion').textContent=stable;
 set('stable','Версия в app-v2-novpn.html',stable===currentVersion,stable===currentVersion?'актуальная: '+stable:'найдено: '+stable+'. Нужно '+currentVersion);
 var loader=await txt('assets/app-v2-orders.js');
 var vm=loader.match(/var v='\?v=([^']+)'/);
 set('loader','Версия загрузчика app-v2-orders.js',!!(vm&&vm[1]===currentVersion),'внутри файла: '+(vm?vm[1]:'не найдено'));
 var ok=0, missing=[];
 for(var i=0;i<moduleFiles.length;i++){
   try{if(await head(moduleFiles[i][1]))ok++;else missing.push(moduleFiles[i][1])}catch(e){missing.push(moduleFiles[i][1]);set('asset_'+moduleFiles[i][0],moduleFiles[i][1],false,e.message)}
 }
 set('assets','Файлы модулей',ok===moduleFiles.length,ok+' из '+moduleFiles.length+' доступны'+(missing.length?'\nНе найдены: '+missing.join(', '):''));
 var required=['finance','timeline','guard','banner','postFlow'];
 var missingRequired=moduleFiles.filter(function(x){return required.indexOf(x[0])>=0 && missing.indexOf(x[1])>=0}).map(function(x){return x[1]});
 set('loader_modules','Подключение новых модулей',missingRequired.length===0 && stable===currentVersion && vm&&vm[1]===currentVersion,missingRequired.length?'Не найдены файлы: '+missingRequired.join(', '):'finance, guard, timeline, banner и post-order-flow доступны; загрузчик актуален');
}
async function login(){var email=el('email').value.trim(),pass=el('password').value;if(!email||!pass)return alert('Введите email и пароль');try{log('Вход...');var r=await timeout(window.db.auth.signInWithPassword({email:email,password:pass}),25000,'Вход не ответил');if(r.error)throw new Error(r.error.message);log('Вход выполнен: '+r.data.user.email);await run()}catch(e){log('Ошибка входа: '+e.message);set('login','Вход',false,e.message)}}
async function reset(){try{await window.db.auth.signOut()}catch(e){}try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('leader_')>=0||k.indexOf('ofewxuqfjhamgerwzull')>=0)localStorage.removeItem(k)})}catch(e){}log('Сессия очищена');set('session','Сессия',false,'Очищена. Войдите заново.')}
async function run(){el('log').textContent='Запускаю полный аудит...';try{await session();log('Вход проверен')}catch(e){log('Авторизация: '+e.message)}try{await data();log('Таблицы проверены')}catch(e){log('Таблицы: '+e.message)}try{await assets();log('Файлы и версии проверены')}catch(e){log('Файлы: '+e.message)}if(!errors.length)set('browser','Ошибки браузера',true,'Новых JS-ошибок на странице аудита не поймано')}
el('runBtn').onclick=run;el('authBtn').onclick=function(){el('log').textContent='Проверяю вход...';session().catch(function(e){log(e.message)})};el('dataBtn').onclick=function(){el('log').textContent='Проверяю таблицы...';data().catch(function(e){log(e.message)})};el('assetsBtn').onclick=function(){el('log').textContent='Проверяю файлы...';assets().catch(function(e){log(e.message)})};el('loginBtn').onclick=login;el('resetBtn').onclick=reset;
setTimeout(function(){assets().catch(function(e){log('Автопроверка файлов: '+e.message)});session().catch(function(e){log('Автопроверка входа: '+e.message)})},500)
})();
</script>
</body>
</html>
